name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Render's own auto-deploy is off (render.yaml autoDeployTrigger: off): the API
  # deploys from here, and only once both test jobs have passed. Vercel deploys
  # the frontend itself on every push.
  deploy-api:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: render-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if only frontend/docs changed
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$before" 2>/dev/null; then
            echo "api=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$before" "${{ github.sha }}" | grep -qvE '^(frontend/|docs/)|\.md$'; then
            echo "api=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=false" >> "$GITHUB_OUTPUT"
            echo "Only frontend/docs changed — Render deploy skipped."
          fi
      - name: Trigger Render deploy and wait
        if: steps.changes.outputs.api == 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          api="https://api.render.com/v1/services/$SERVICE_ID/deploys"
          auth=(-H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json")
          deploy_id=$(curl -fsS "${auth[@]}" -H "Content-Type: application/json" -X POST "$api" \
            -d "{\"commitId\":\"${{ github.sha }}\",\"clearCache\":\"do_not_clear\"}" | jq -r .id)
          echo "Render deploy $deploy_id for ${{ github.sha }}"
          for _ in $(seq 1 60); do
            status=$(curl -fsS "${auth[@]}" "$api/$deploy_id" | jq -r .status)
            echo "status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for the Render deploy"; exit 1
