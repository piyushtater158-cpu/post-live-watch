<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Post-Live Watch{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
    <div class="sample-banner">SAMPLE DATA — synthetic GlowLeaf campaign, no real Instagram data</div>
    <nav class="topnav">
        <div class="brand">Post-Live Watch</div>
        <div class="links">
            <a href="/">Overview</a>
            <a href="/queue">Flag Queue</a>
            <a href="/creators">Creators</a>
            <a href="/report">Brand Report</a>
            <a href="/decisions">Decision Log</a>
        </div>
        <div class="controls">
            <form method="post" action="/settings/ai-toggle" style="display:inline">
                <button type="submit" class="pill {{ 'on' if ai_enabled else 'off' }}">
                    AI {{ 'ON' if ai_enabled else 'OFF' }}
                </button>
            </form>
            <span class="day-indicator">Day {{ current_day }}/{{ duration_days }}</span>
            <form method="post" action="/simulate/advance-day" style="display:inline">
                <button type="submit" {% if current_day >= duration_days %}disabled{% endif %}>Advance day ▶</button>
            </form>
            <form method="post" action="/simulate/reset-day" style="display:inline">
                <button type="submit" class="secondary">Reset to day 1</button>
            </form>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
